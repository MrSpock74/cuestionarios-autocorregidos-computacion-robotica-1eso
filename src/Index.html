<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuestionario</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#0891b2; --accent-2:#c2660a; --accent-3:#be185d; --accent-4:#4f46e5; --accent-5:#15803d;
    --ink:#181c34; --ink-soft:#4c5170; --muted:#6b7094;
    --bg:#f4f5fb; --bg-panel:#ffffff; --bg-panel-2:#eceffb;
    --line:rgba(24,28,52,.13);
    --ok:#0a8f5b; --bad:#c22a3e; --warn:#b45309;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif; margin:0 0 .4em; color:var(--ink);}
  .wrap{max-width:780px; margin:0 auto; padding:28px 18px 80px;}

  .top{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
  .top .badge{
    width:46px; height:46px; border-radius:14px; flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent-3));
    display:flex; align-items:center; justify-content:center;
    font-size:22px; color:#fff; font-family:'Baloo 2',system-ui,sans-serif; font-weight:800;
  }
  .top h1{font-size:1.35rem; margin:0;}
  .top p{margin:2px 0 0; color:var(--muted); font-size:.92rem;}

  .card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:18px;
    padding:22px 22px 24px; margin-bottom:18px;
    box-shadow:0 2px 10px rgba(24,28,52,.05);
  }

  /* --- identificación --- */
  #screen-id .field{margin-bottom:16px;}
  #screen-id label{display:block; font-weight:700; margin-bottom:6px; font-size:.92rem; color:var(--ink-soft);}
  #screen-id input[type=text]{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
    font-family:inherit; font-size:1rem; background:var(--bg-panel-2); color:var(--ink);
  }
  #screen-id input[type=text]:focus{outline:none; border-color:var(--accent);}
  .email-box{
    display:flex; align-items:center; gap:10px;
    background:var(--bg-panel-2); border:1.5px dashed var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:18px; font-weight:700; color:var(--accent); word-break:break-all;
  }
  .email-box.err{color:var(--bad); border-color:var(--bad);}

  /* --- progreso --- */
  .blocks-nav{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .blocks-nav button{
    font-family:inherit; font-size:.82rem; font-weight:700; padding:6px 12px; border-radius:999px; cursor:pointer;
    background:var(--bg-panel-2); color:var(--muted); border:1.5px solid transparent;
  }
  .blocks-nav button.done{background:rgba(10,143,91,.12); color:var(--ok);}
  .blocks-nav button:hover{border-color:var(--line);}
  .progress{
    position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 10px; margin-bottom:10px;
    display:flex; align-items:center; gap:12px; font-size:.85rem; font-weight:800; color:var(--ink-soft);
  }
  .progress .bar{flex:1; height:10px; border-radius:99px; background:var(--bg-panel-2); overflow:hidden; border:1px solid var(--line);}
  .progress .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent-3)); transition:width .25s;}

  .block-title{display:flex; align-items:center; gap:10px; margin:26px 0 10px;}
  .block-title:first-child{margin-top:0;}
  .block-title .dot{width:12px; height:12px; border-radius:50%; background:var(--accent);}
  .block-title h3{margin:0; font-size:1.2rem;}
  .b1 .dot{background:var(--accent-2);} .b2 .dot{background:var(--accent-3);}
  .b3 .dot{background:var(--accent-4);} .b4 .dot{background:var(--accent-5);}

  .q{margin-bottom:22px; padding-bottom:20px; border-bottom:1px solid var(--line);}
  .q:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
  .q > p.prompt{font-weight:700; margin:0 0 12px; color:var(--ink); display:flex; gap:10px; align-items:flex-start;}
  .qn{
    flex:0 0 auto; min-width:26px; height:26px; padding:0 6px; border-radius:99px; margin-top:1px;
    background:var(--ink); color:#fff; font-size:.78rem; font-weight:800;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .q.missing{outline:2px solid rgba(194,42,62,.45); outline-offset:8px; border-radius:6px;}

  .opt-list{display:flex; flex-direction:column; gap:8px;}
  .opt-list.mono .opt span{font-family:Consolas,'Courier New',monospace; font-size:.95em;}
  .fig{margin:2px 0 14px; max-width:560px;}
  .fig svg{display:block; width:100%; height:auto; border-radius:10px;}
  .opt{
    display:flex; align-items:flex-start; gap:10px; padding:10px 12px;
    border-radius:12px; border:1.5px solid var(--line); background:var(--bg-panel-2);
    cursor:pointer; font-size:.96rem;
  }
  .opt input{margin-top:4px; flex:none;}
  .opt:hover{border-color:var(--accent);}
  .opt:has(input:checked){border-color:var(--accent); background:rgba(8,145,178,.1);}

  /* ordenar */
  .order-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .order-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border-radius:12px; border:1.5px solid var(--line); background:var(--bg-panel-2);
    font-size:.94rem; cursor:grab; user-select:none;
  }
  .order-item .handle{color:var(--muted); font-size:1.1rem;}
  .order-item.dragging{opacity:.5;}
  .order-item .txt{flex:1;}
  .order-item .num{
    width:24px; height:24px; border-radius:50%; background:var(--accent-3); color:#fff;
    font-size:.78rem; font-weight:800; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .order-item .mv{
    border:1.5px solid var(--line); background:var(--bg-panel); color:var(--ink-soft); border-radius:8px;
    width:32px; height:32px; cursor:pointer; font-size:.8rem; line-height:1; flex:none;
  }
  .order-item .mv:hover{border-color:var(--accent); color:var(--accent);}

  /* respuestas cortas */
  .mini-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:480px){.mini-grid{grid-template-columns:1fr;}}
  .mini-field label{display:block; font-size:.82rem; color:var(--muted); font-weight:700; margin-bottom:4px;}
  .mini-field input{
    width:100%; padding:9px 11px; border-radius:10px; border:1.5px solid var(--line);
    font-family:inherit; font-size:.95rem; background:var(--bg-panel-2); color:var(--ink);
  }
  .mini-field input:focus{outline:none; border-color:var(--accent-3);}
  .short-input{
    width:100%; max-width:260px; padding:10px 13px; border-radius:10px; border:1.5px solid var(--line);
    font-family:inherit; font-size:1rem; background:var(--bg-panel-2); color:var(--ink);
  }
  .short-input:focus{outline:none; border-color:var(--accent-3);}

  /* emparejar y huecos */
  select.sel{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    font-family:inherit; font-size:.95rem; background:var(--bg-panel-2); color:var(--ink);
  }
  select.sel:focus{outline:none; border-color:var(--accent);}
  select.sel.filled{border-color:var(--accent); background:rgba(8,145,178,.1);}
  .match-list{display:flex; flex-direction:column; gap:10px;}
  .match-row{
    display:grid; grid-template-columns:1fr minmax(180px,38%); gap:12px; align-items:center;
    padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--bg-panel);
  }
  @media(max-width:560px){.match-row{grid-template-columns:1fr;}}
  .match-row .lbl{font-size:.94rem; min-width:0;}

  /* Bloques de Scratch (imágenes generadas con scratch-blocks, Apache-2.0) */
  .fig .blkfig{overflow-x:auto;}
  .fig svg.sbk{display:inline-block; width:auto; max-width:100%; height:auto; border-radius:0;}
  .abcd{display:flex; flex-direction:column; gap:10px;}
  .abcd-row{display:flex; align-items:center; gap:12px;}
  .abcd-l{flex:none; width:30px; height:30px; border-radius:50%; background:#1a73e8; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .abcd-b{overflow-x:auto; min-width:0;}
  .abcd-b svg.sbk{display:block; width:auto; max-width:100%; height:auto;}
  .match-blk svg.sbk{display:block; max-width:100%; height:auto;}
  .fig .blkfig + .blkfig{margin-top:8px;}

<script>
(function(){
  var QUIZ = <?!= quizJson ?>;
  var EMAIL = <?!= JSON.stringify(email) ?>;

  var screens = {
    id: document.getElementById('screen-id'),
    quiz: document.getElementById('screen-quiz'),
    done: document.getElementById('screen-done')
  };
  function showScreen(name){
    Object.keys(screens).forEach(function(k){ screens[k].classList.toggle('active', k===name); });
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function fmt(n){ return String(n).replace('.', ','); }
  function byEs(a, b){ return String(a).localeCompare(String(b), 'es'); }

  // ---------- cabecera y errores ----------
  if (QUIZ && !QUIZ.error){
    document.getElementById('topBadge').textContent = QUIZ.icono || '📝';
    document.getElementById('topTitle').textContent = 'Cuestionario ' + QUIZ.titulo;
    document.getElementById('topSub').textContent = QUIZ.subtitulo || '';
    document.title = 'Cuestionario ' + QUIZ.titulo;
  } else {
    document.getElementById('idForm').style.display = 'none';
    var eb = el('div', 'error-box', '⚠️ ' + ((QUIZ && QUIZ.error) || 'No se ha podido cargar el cuestionario.'));
    document.getElementById('idError').appendChild(eb);
  }

  // ---------- pantalla 1 ----------
  var idError = document.getElementById('idError');
  document.getElementById('btnStart').addEventListener('click', function(){
    idError.innerHTML = '';
    if (!val('fNombre') || !val('fApellidos') || !val('fGrupo')){
      idError.appendChild(el('div', 'error-box', 'Escribe tu nombre, tus apellidos y tu grupo para empezar.'));
      return;
    }
    startQuiz();
  });
  function val(id){ return document.getElementById(id).value.trim(); }

  // ---------- cuestionario ----------
  var host = document.getElementById('questionsHost');
  var attemptTouched = {};   // preguntas de ordenar ya tocadas

  function startQuiz(){
    attemptTouched = {};
    missingWarned = false;
    document.getElementById('errBox').innerHTML = '';
    btnSubmit.disabled = false;
    btnSubmit.textContent = 'Enviar cuestionario ✓';
    renderQuestions();
    updateProgress();
    showScreen('quiz');
  }

  function renderQuestions(){
    host.innerHTML = '';
    var lastBlock = null, n = 0, bi = -1;
    var order = QUIZ.blocks.map(function(b){ return b.id; });
    QUIZ.questions.forEach(function(q){
      if (q.block !== lastBlock){
        bi = order.indexOf(q.block);
        var bt = el('div', 'block-title b' + (bi % 5));
        bt.id = 'blk-' + q.block;
        bt.appendChild(el('span', 'dot'));
        bt.appendChild(el('h3', null, labelOf(q.block)));
        host.appendChild(bt);
        lastBlock = q.block;
      }
      n++;
      host.appendChild(renderQuestion(q, n));
    });
    var nav = document.getElementById('blocksNav');
    nav.innerHTML = '';
    QUIZ.blocks.forEach(function(b){
      var btn = el('button', null, b.label);
      btn.type = 'button';
      btn.dataset.block = b.id;
      btn.addEventListener('click', function(){
        var t = document.getElementById('blk-' + b.id);
        if (t) t.scrollIntoView({behavior:'smooth', block:'start'});
      });
      nav.appendChild(btn);
    });
  }
  function labelOf(blockId){
    for (var i = 0; i < QUIZ.blocks.length; i++){ if (QUIZ.blocks[i].id === blockId) return QUIZ.blocks[i].label; }
    return blockId;
  }

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function hintEl(text){ return el('p', 'hint', text); }

  function makeRadio(name, value, label){
    var l = el('label', 'opt');
    var i = document.createElement('input');
    i.type = 'radio'; i.name = name; i.value = value;
    l.appendChild(i); l.appendChild(el('span', null, label));
    return l;
  }
  function makeCheckbox(name, value, label){
    var l = el('label', 'opt');
    var i = document.createElement('input');
    i.type = 'checkbox'; i.name = name; i.value = value;
    l.appendChild(i); l.appendChild(el('span', null, label));
    return l;
  }
  function makeSelect(choices, ariaLabel){
    var s = el('select', 'sel');
    s.setAttribute('aria-label', ariaLabel || 'Elige una opción');
    var ph = el('option', null, '— elige —'); ph.value = '';
    s.appendChild(ph);
    choices.slice().sort(byEs).forEach(function(c){
      var o = el('option', null, c); o.value = c; s.appendChild(o);
    });
    s.addEventListener('change', function(){ s.classList.toggle('filled', s.value !== ''); });
    return s;
  }

  function renderQuestion(q, number){
    var wrap = el('div', 'q');
    wrap.dataset.qid = q.id;

    var p = el('p', 'prompt');
    p.appendChild(el('span', 'qn', String(number)));
    p.appendChild(el('span', null, q.prompt));
    wrap.appendChild(p);
    if (q.fig){
      var fg = el('div', 'fig');
      fg.innerHTML = q.fig;   // dibujo SVG propio, enviado por el servidor
      wrap.appendChild(fg);
    }

    if (q.type === 'tf'){
      var list = el('div', 'opt-list');
      list.appendChild(makeRadio(q.id, 'true', 'Verdadero'));
      list.appendChild(makeRadio(q.id, 'false', 'Falso'));
      wrap.appendChild(list);

    } else if (q.type === 'mc'){
      var opts = q.options.slice();
      if (!q.noShuffle) shuffle(opts);
      var list2 = el('div', 'opt-list' + (q.mono ? ' mono' : ''));
      opts.forEach(function(o){ list2.appendChild(makeRadio(q.id, o, o)); });
      wrap.appendChild(list2);

    } else if (q.type === 'multi'){
      var opts3 = q.options.slice();
      shuffle(opts3);
      var list3 = el('div', 'opt-list');
      opts3.forEach(function(o){ list3.appendChild(makeCheckbox(q.id, o, o)); });
      wrap.appendChild(list3);
      wrap.appendChild(hintEl('Puede haber más de una respuesta correcta.'));

    } else if (q.type === 'order'){
      var ol = el('div', 'order-list');
      ol.dataset.qid = q.id;
      var order = q.steps.map(function(_, i){ return i; });
      shuffle(order);
      order.forEach(function(orig){
        var item = el('div', 'order-item');
        item.draggable = true;
        item.dataset.orig = orig;
        item.appendChild(el('span', 'handle', '⠿'));
        item.appendChild(el('span', 'num'));
        item.appendChild(el('span', 'txt', q.steps[orig]));
        var up = el('button', 'mv', '▲'); up.type = 'button'; up.setAttribute('aria-label', 'Subir');
        var dn = el('button', 'mv', '▼'); dn.type = 'button'; dn.setAttribute('aria-label', 'Bajar');
        up.addEventListener('click', function(){
          var prev = item.previousElementSibling;
          if (prev){ ol.insertBefore(item, prev); touched(q.id); renumber(ol); }
        });
        dn.addEventListener('click', function(){
          var next = item.nextElementSibling;
          if (next){ ol.insertBefore(next, item); touched(q.id); renumber(ol); }
        });
        item.appendChild(up); item.appendChild(dn);
        ol.appendChild(item);
      });
      setupDrag(ol, q.id);
      renumber(ol);
      wrap.appendChild(ol);
      wrap.appendChild(hintEl('Ordénalas con las flechas ▲▼ o arrastrando las tarjetas, de la 1 a la ' + q.steps.length + '.'));

    } else if (q.type === 'short'){
      var inp = el('input', 'short-input');
      inp.type = 'text'; inp.autocomplete = 'off';
      wrap.appendChild(inp);

    } else if (q.type === 'short-multi' || q.type === 'char-multi'){
      var grid = el('div', 'mini-grid');
      q.items.forEach(function(it, i){
        var f = el('div', 'mini-field');
        f.appendChild(el('label', null, it.label));
        var inp2 = document.createElement('input');
        inp2.type = 'text'; inp2.dataset.idx = i; inp2.autocomplete = 'off'; inp2.spellcheck = false;
        f.appendChild(inp2);
        grid.appendChild(f);
      });
      wrap.appendChild(grid);
      if (q.type === 'short-multi') wrap.appendChild(hintEl(q.hint || 'Escribe la combinación tal cual, por ejemplo: Ctrl+C'));

    } else if (q.type === 'match'){
      var ml = el('div', 'match-list');
      q.items.forEach(function(it, i){
        var row = el('div', 'match-row');
        var lab = el('div', 'lbl');
        if (it.svg){
          var sv = el('div', 'match-blk');
          sv.innerHTML = it.svg;   // bloque de Scratch dibujado por el servidor
          lab.appendChild(sv);
        } else if (it.icon){
          var ns = 'http://www.w3.org/2000/svg';
          var svg = document.createElementNS(ns, 'svg');
          svg.setAttribute('class', 'ico'); svg.setAttribute('viewBox', '0 0 40 40');
          svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Símbolo ' + (i + 1));
          var use = document.createElementNS(ns, 'use');
          use.setAttribute('href', '#' + it.icon);
          svg.appendChild(use);
          lab.appendChild(svg);
        } else {
          lab.textContent = it.label;
        }
        row.appendChild(lab);
        row.appendChild(makeSelect(q.choices, it.label || ('Símbolo ' + (i + 1))));
        ml.appendChild(row);
      });
      wrap.appendChild(ml);

    } else if (q.type === 'gaps'){
      var gp = el('div', 'gaps-text');
      var parts = q.text.split(/\[\[(\d+)\]\]/);
      parts.forEach(function(part, i){
        if (i % 2 === 0){ gp.appendChild(document.createTextNode(part)); }
        else { gp.appendChild(makeSelect(q.bank, 'Hueco ' + (Number(part) + 1))); }
      });
      wrap.appendChild(gp);
    }
    return wrap;
  }

  // ---------- ordenar: arrastrar ----------
  function setupDrag(list, qid){
    var dragEl = null;
    list.addEventListener('dragstart', function(e){
      dragEl = e.target.closest('.order-item');
      if (!dragEl) return;
      dragEl.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', 'x'); } catch (err) {}
    });
    list.addEventListener('dragend', function(){
      if (dragEl) dragEl.classList.remove('dragging');
      dragEl = null;
      touched(qid);
      renumber(list);
    });
    list.addEventListener('dragover', function(e){
      e.preventDefault();
      var dragging = list.querySelector('.dragging');
      if (!dragging) return;
      var after = afterElement(list, e.clientY);
      if (after == null) list.appendChild(dragging);
      else list.insertBefore(dragging, after);
    });
  }
  function afterElement(list, y){
    var items = Array.prototype.slice.call(list.querySelectorAll('.order-item:not(.dragging)'));
    var closest = { offset: -Infinity, element: null };
    items.forEach(function(child){
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) closest = { offset: offset, element: child };
    });
    return closest.element;
  }
  function renumber(list){
    Array.prototype.forEach.call(list.querySelectorAll('.order-item'), function(item, i){
      item.querySelector('.num').textContent = i + 1;
    });
  }
  function touched(qid){ attemptTouched[qid] = true; updateProgress(); }

  // ---------- recogida de respuestas ----------
  function qEl(q){ return host.querySelector('.q[data-qid="' + q.id + '"]'); }

  function readAnswer(q){
    var e = qEl(q);
    if (!e) return null;
    if (q.type === 'tf'){
      var c = e.querySelector('input[type=radio]:checked');
      return c ? (c.value === 'true') : null;
    }
    if (q.type === 'mc'){
      var c2 = e.querySelector('input[type=radio]:checked');
      return c2 ? c2.value : null;
    }
    if (q.type === 'multi'){
      return Array.prototype.map.call(e.querySelectorAll('input[type=checkbox]:checked'), function(x){ return x.value; });
    }
    if (q.type === 'order'){
      return Array.prototype.map.call(e.querySelectorAll('.order-item'), function(it){ return it.dataset.orig; });
    }
    if (q.type === 'short'){
      var i1 = e.querySelector('input[type=text]');
      return i1 ? i1.value.trim() : '';
    }
    if (q.type === 'short-multi' || q.type === 'char-multi'){
      return Array.prototype.map.call(e.querySelectorAll('input[type=text]'), function(x){ return x.value.trim(); });
    }
    if (q.type === 'match' || q.type === 'gaps'){
      return Array.prototype.map.call(e.querySelectorAll('select'), function(s){ return s.value; });
    }
    return null;
  }
  function isAnswered(q){
    var a = readAnswer(q);
    if (q.type === 'order') return true; // el orden que se ve ya es una respuesta
    if (q.type === 'tf') return a !== null;
    if (q.type === 'mc') return a !== null;
    if (q.type === 'short') return a !== '';
    if (q.type === 'multi') return a.length > 0;
    // varias casillas o desplegables: contestada cuando están todos rellenos
    return a.length > 0 && a.every(function(x){ return x !== ''; });
  }
  function collectAnswers(){
    var answers = {};
    QUIZ.questions.forEach(function(q){ answers[q.id] = readAnswer(q); });
    return answers;
  }

  // ---------- progreso ----------
  function updateProgress(){
    if (!QUIZ || QUIZ.error || !host.firstChild) return;
    var total = QUIZ.questions.length, done = 0;
    var perBlock = {};
    QUIZ.blocks.forEach(function(b){ perBlock[b.id] = { done: 0, total: 0 }; });
    QUIZ.questions.forEach(function(q){
      var ok = isAnswered(q);
      if (ok) done++;
      perBlock[q.block].total++;
      if (ok) perBlock[q.block].done++;
      var e = qEl(q);
      if (e && ok) e.classList.remove('missing');
    });
    document.getElementById('progText').textContent = 'Contestadas: ' + done + ' / ' + total;
    document.getElementById('progFill').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
    Array.prototype.forEach.call(document.querySelectorAll('#blocksNav button'), function(btn){
      var pb = perBlock[btn.dataset.block];
      if (!pb) return;
      btn.textContent = labelOf(btn.dataset.block) + ' · ' + pb.done + '/' + pb.total;
      btn.classList.toggle('done', pb.done === pb.total);
    });
  }
  host.addEventListener('change', updateProgress);
  host.addEventListener('input', updateProgress);

  // ---------- envío ----------
  var btnSubmit = document.getElementById('btnSubmit');
  var errBox = document.getElementById('errBox');
  var missingWarned = false;

  btnSubmit.addEventListener('click', function(){
    errBox.innerHTML = '';
    var missing = QUIZ.questions.filter(function(q){ return !isAnswered(q); });
    if (missing.length && !missingWarned){
      missingWarned = true;
      missing.forEach(function(q){ var e = qEl(q); if (e) e.classList.add('missing'); });
      errBox.appendChild(el('div', 'warn-box', 'Te faltan ' + missing.length + (missing.length === 1 ? ' pregunta' : ' preguntas') + ' por contestar (están marcadas en rojo). Si quieres enviar el cuestionario así, pulsa otra vez el botón.'));
      var first = qEl(missing[0]);
      if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
      btnSubmit.textContent = 'Enviar igualmente ✓';
      return;
    }

    var payload = {
      quiz: QUIZ.id,
      seed: QUIZ.seed,
      nombre: val('fNombre'),
      apellidos: val('fApellidos'),
      grupo: val('fGrupo'),
      answers: collectAnswers()
    };

    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<span class="spinner"></span> Enviando…';

    google.script.run
      .withSuccessHandler(function(result){ showResult(result); })
      .withFailureHandler(function(err){
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Enviar cuestionario ✓';
        errBox.appendChild(el('div', 'error-box', '⚠️ ' + (err && err.message ? err.message : 'No se ha podido enviar el cuestionario. Inténtalo de nuevo.')));
      })
      .submitQuiz(payload);
  });

  function showResult(result){
    var pct = Math.round((result.score / result.max) * 100);
    document.getElementById('scoreCircle').style.setProperty('--pct', pct);
    document.getElementById('scoreNum').textContent = fmt(result.score);
    document.getElementById('scoreMsg').textContent = result.message;

    var host2 = document.getElementById('blockResults');
    host2.innerHTML = '';
    QUIZ.blocks.forEach(function(b){
      var r = result.perBlock[b.id];
      if (!r) return;
      var ratio = r.total ? r.correct / r.total : 0;
      var row = el('div', 'block-result' + (ratio < 0.6 ? ' low' : ''));
      var top = el('div', 'row');
      var left = el('span', null, b.label);
      if (ratio < 0.6) left.appendChild(el('span', 'rev', '📖 repásalo en el libro'));
      top.appendChild(left);
      top.appendChild(el('span', null, fmt(r.correct) + ' de ' + fmt(r.total)));
      row.appendChild(top);
      var bar = el('div', 'mbar'); var fill = el('i'); fill.style.width = Math.round(ratio * 100) + '%'; bar.appendChild(fill);
      row.appendChild(bar);
      host2.appendChild(row);
    });
    document.getElementById('retryErr').innerHTML = '';
    document.getElementById('btnRetry').disabled = false;
    showScreen('done');
  }

  // ---------- otro intento (nuevas preguntas al azar) ----------
  document.getElementById('btnRetry').addEventListener('click', function(){
    var b = this;
    b.disabled = true;
    document.getElementById('retryErr').innerHTML = '';
    google.script.run
      .withSuccessHandler(function(d){
        if (!d || d.error){
          b.disabled = false;
          document.getElementById('retryErr').appendChild(el('div', 'error-box', '⚠️ ' + ((d && d.error) || 'No se ha podido preparar otro intento.')));
          return;
        }
        QUIZ = d;
        startQuiz();
      })
      .withFailureHandler(function(err){
        b.disabled = false;
        document.getElementById('retryErr').appendChild(el('div', 'error-box', '⚠️ ' + (err && err.message ? err.message : 'No se ha podido preparar otro intento.')));
      })
      .getQuiz(QUIZ.id);
  });
})();
</script>
